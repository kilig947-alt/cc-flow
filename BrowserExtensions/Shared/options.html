<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CC FLOW 浏览器配对</title>
  <style>
    :root { color-scheme: light dark; --accent:#0d9488; --surface:#fff; --text:#143c3a; --muted:#526765; --border:#b7d8d4; --error:#b42318; --success:#067647; }
    * { box-sizing:border-box; }
    body { margin:0; padding:40px 20px; background:#f0fdfa; color:var(--text); font:15px/1.6 system-ui,-apple-system,sans-serif; }
    main { max-width:600px; margin:0 auto; padding:32px; border:1px solid var(--border); border-radius:16px; background:var(--surface); box-shadow:0 12px 32px rgb(15 118 110 / 10%); }
    h1 { margin:0 0 8px; font-size:26px; line-height:1.25; }
    .intro,.helper { color:var(--muted); }
    ol { margin:24px 0; padding-left:22px; }
    li + li { margin-top:8px; }
    label { display:block; margin-bottom:6px; font-weight:650; }
    input { width:100%; min-height:44px; padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:Canvas; color:CanvasText; font:14px ui-monospace,SFMono-Regular,Menlo,monospace; }
    input:focus { outline:3px solid rgb(13 148 136 / 28%); border-color:var(--accent); }
    .actions { display:flex; align-items:center; gap:12px; margin-top:16px; flex-wrap:wrap; }
    button { min-height:44px; padding:9px 20px; border:0; border-radius:9px; background:var(--accent); color:white; font-weight:700; cursor:pointer; }
    button:hover { filter:brightness(.94); }
    button:focus-visible { outline:3px solid rgb(13 148 136 / 32%); outline-offset:2px; }
    button:disabled { cursor:wait; opacity:.55; }
    #status { min-height:24px; color:var(--muted); font-weight:600; }
    #status[data-state="success"] { color:var(--success); }
    #status[data-state="error"] { color:var(--error); }
    @media (prefers-color-scheme:dark) { :root { --surface:#112321; --text:#edfdfb; --muted:#a9c7c3; --border:#345b56; } body { background:#081513; } }
    @media (max-width:480px) { body { padding:16px; } main { padding:24px 20px; } }
  </style>
</head>
<body>
  <main>
    <h1>连接 CC FLOW</h1>
    <p class="intro">配对后，点击浏览器工具栏中的 CC FLOW 图标即可把当前网页保存到“浏览器资源”。</p>
    <ol>
      <li>打开 CC FLOW 的“设置 → 左侧功能 → 生产力连接”。</li>
      <li>点击“显示并复制”获取浏览器配对令牌。</li>
      <li>将令牌粘贴到下方并保存。</li>
    </ol>
    <form id="pairingForm" novalidate>
      <label for="token">配对令牌</label>
      <input id="token" type="password" autocomplete="off" spellcheck="false" aria-describedby="tokenHelp status" placeholder="粘贴 CC FLOW 配对令牌">
      <p id="tokenHelp" class="helper">令牌仅保存在此扩展的本地存储中，并只发送到 127.0.0.1。</p>
      <div class="actions">
        <button id="save" type="submit">保存并连接</button>
        <span id="status" role="status" aria-live="polite"></span>
      </div>
    </form>
  </main>
  <script src="options.js"></script>
</body>
</html>
