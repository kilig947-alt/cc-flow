name: Debug Packages

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: debug-packages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  debug-release:
    name: Build and publish Debug DMG
    runs-on: macos-26
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: debug-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build Debug for Apple Silicon
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          xcodebuild -project CCFlow.xcodeproj -scheme CCFlow \
            -configuration Debug -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -destination 'generic/platform=macOS' ARCHS=arm64 ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_ALLOWED=NO \
            SPARKLE_APPCAST_URL= SPARKLE_PUBLIC_ED_KEY= \
            build 2>&1 | tee "$RUNNER_TEMP/debug-build.log"

      - name: Prepare and verify ad-hoc signed app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/DerivedData/Build/Products/Debug/CC FLOW.app"
          PLIST="$APP_PATH/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c 'Set :SUEnableAutomaticChecks false' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :SUAutomaticallyUpdate false' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Set :SUAllowsAutomaticUpdates false' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :SUFeedURL' "$PLIST"
          /usr/libexec/PlistBuddy -c 'Delete :SUPublicEDKey' "$PLIST"
          codesign --force --deep --sign - \
            --entitlements CCFlow/Resources/CCFlow.entitlements "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          lipo -verify_arch arm64 "$APP_PATH/Contents/MacOS/CC FLOW"

      - name: Package DMG and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/debug-dist" "$RUNNER_TEMP/debug-staging"
          ditto "$RUNNER_TEMP/DerivedData/Build/Products/Debug/CC FLOW.app" \
            "$RUNNER_TEMP/debug-staging/CC FLOW.app"
          ln -s /Applications "$RUNNER_TEMP/debug-staging/Applications"
          hdiutil create -volname 'CC FLOW Debug' -srcfolder "$RUNNER_TEMP/debug-staging" \
            -format UDZO "$RUNNER_TEMP/debug-dist/CCFlow-$RELEASE_TAG-arm64.dmg"
          hdiutil verify "$RUNNER_TEMP/debug-dist/CCFlow-$RELEASE_TAG-arm64.dmg"
          cd "$RUNNER_TEMP/debug-dist"
          shasum -a 256 *.dmg > SHA256SUMS.txt

      - name: Publish prerelease
        shell: bash
        run: |
          set -euo pipefail
          NOTES="$RUNNER_TEMP/debug-notes.md"
          cat > "$NOTES" <<'EOF'
          ## Debug 测试版 / Debug preview

          - Apple Silicon（M1 / M2 / M3 / M4 等），macOS 14 或更新版本。
          - 使用 Debug 配置构建，性能和日志行为与正式版不同。
          - 仅 ad-hoc 临时签名，**未经过 Apple Developer ID 签名或 Apple 公证**。
          - 下载 DMG，将 CC FLOW 拖入 Applications；请先退出正在运行的旧版。
          - 与正式版共用应用标识和本地设置，安装前请备份重要配置。
          - 如果 macOS 因无法验证开发者而阻止启动，请在确认来源后通过「系统设置 → 隐私与安全 → 仍要打开」操作。无需关闭系统整体安全保护。
          - 本包关闭自动更新检查，不发布 Sparkle appcast，不设为 Latest。
          - 请反馈 macOS 版本、复现步骤及截图；不要上传 API Key 或私人原文。

          Apple Silicon only. Ad-hoc signed, not notarized. This Debug build shares settings with the regular app. Automatic updates are disabled. Verify the download with SHA256SUMS.txt.
          EOF
          printf '\nSource commit: `%s`\n' "$GITHUB_SHA" >> "$NOTES"
          gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" --draft --prerelease \
            --title "CC FLOW Debug $RELEASE_TAG" --notes-file "$NOTES" \
            "$RUNNER_TEMP/debug-dist/CCFlow-$RELEASE_TAG-arm64.dmg" \
            "$RUNNER_TEMP/debug-dist/SHA256SUMS.txt"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease --latest=false

      - name: Preserve build log and package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-build-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/debug-build.log
            ${{ runner.temp }}/debug-dist/
          retention-days: 14
